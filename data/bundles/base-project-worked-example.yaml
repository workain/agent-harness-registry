name: base-project-worked-example
slug: base-project-worked-example
homepage: https://github.com/workain/agent-harness-registry/tree/main/templates/base-project-worked-example
what_it_is: >
  A filled-in, clone-and-run companion to this lab's own `base-project-template` component:
  the same scaffold with every `<BRACKETED>` placeholder replaced by real content for one
  deliberately small carrier project, so the seven-rung harness ladder (instructions → memory
  → hooks → skill → MCP → subagent → process) can be read off real files and a real commit
  history instead of a skeleton. The carrier is `signup-landing/` — a single-page Vite landing
  page with a two-field (name, email) demo-lesson signup form, no backend of its own, Playwright
  `tests/form.spec.ts` asserting the form refuses empty required fields, and static hosting.
  Its purpose is pedagogical rather than functional: the build is the artifact, the landing page
  is only what the artifact is built ON, and the design is explicitly held small so the carrier
  never becomes a second product. Distinct from the template it derives from in exactly one
  respect — the template teaches the SHAPE of a harness and ships blanks; this ships one
  worked instance of that shape, wrong turns and honest gaps included (rung 5 deliberately
  ships no working MCP connection at all — see the deep-dive).
components_bundled:
  - "instructions (rung 1): filled `CLAUDE.md` with real build/test/verify commands + `AGENTS.md` symlink"
  - "memory (rung 2): committed `DECISIONS.md` decision journal; runtime auto-memory demonstrated but deliberately NOT committed (it lives outside the repo)"
  - "hooks (rung 3): two `PreToolUse` hooks in one `.claude/settings.json` array (branch-protection + `rm -rf` wildcard block) plus a single self-test script covering both"
  - "skill (rung 4): `.claude/skills/deploy/SKILL.md`"
  - "MCP (rung 5): a README ANALYSIS section only — no `.mcp.json` with working credentials. Work order § 8.5 is explicit that this is the EXECUTOR'S RECOMMENDATION, not the owner's decision, and is to be reopened on review — so read this slot as declined-pending-ruling, not settled"
  - "subagent (rung 6): `.claude/agents/diff-reviewer.md`, read-only `tools:` (no Write/Edit)"
  - "process (rung 7): `Tasks/` discipline with at least one real `Tasks/<date>_<slug>/` carrying `log.md` + `review.md`"
  - "carrier project: `signup-landing/` (Vite page, two-field form, Playwright `tests/form.spec.ts`)"
engine_lock: "Claude Code (hooks, skills, subagents, settings.json are all its conventions); only rung 1 ports via the AGENTS.md symlink"
license_tag: "MIT"
license: >
  MIT — the same licence and the same reasoning as the template it derives from, since it lives
  under `templates/` (see the root README's licensing table: `templates/` and `scripts/` are MIT
  precisely so they can be copied wholesale into other people's projects, while the registry
  content itself is CC BY 4.0).
