unverified:
  - "NO research pass. base-project-template's content decisions each trace to one of two documented evidence passes; this template's do not. Its structure was derived from that template plus a seminar's teaching sequence, and should be read as a plausible, internally-consistent starting point rather than an evidence-backed default. Nothing here contradicts that entry's evidence — but nothing independently supports the subtractive 'one gate, everything else deleted' claim either, which is this template's single most load-bearing design decision."
  - "Verified only mechanically, and only on one machine (Linux, git 2.x, bash): the branch guard self-test reports PASS on 9/9 checks and prints its own 5 known limits; a `cp -RP` + `git init` + self-test run from a clean clone succeeds with the AGENTS.md symlink intact; `scripts/generate.py` exits 0. NOT tested: any other OS or shell, any agent engine other than Claude Code, multi-contributor use, or drift over time."
  - "Whether an engine auto-loads a subdirectory instruction file (`tests/CLAUDE.md`) on the path of an edit is NOT established here for Claude Code — this registry documents that behavior for Gemini CLI and Cursor only. The template therefore names that file from the root CLAUDE.md as an explicit pointer, which works either way; readers should not take its presence as evidence that auto-discovery happens."
  - "Written in Russian, unlike the rest of this registry — it was authored for a Russian-language seminar audience. No translated variant exists."
