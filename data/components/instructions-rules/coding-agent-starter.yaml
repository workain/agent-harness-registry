name: coding-agent-starter
slug: coding-agent-starter
homepage: https://github.com/workain/agent-harness-registry/tree/main/templates/coding-agent-starter
category: instructions-rules
layer: "Instruction/identity layer (Block A) plus day-0 seeds of the decision-memory and gate blocks — a 16-file project scaffold one rung below base-project-template, not a single convention file"
what_it_is: >
  A deliberately small, copy-ready project scaffold for a repository a coding agent will work
  in. Its organizing claim is subtractive: a CLAUDE.md holding a one-line project identity and
  exactly ONE gate, with every other section removed rather than shipped as unfilled
  boilerplate, on the reasoning that instruction text is billed on every turn and a rule written
  ahead of a real need has nothing to check it. The remaining sections ship as ready-to-paste
  blocks in `doc/claude-md-sections.md`, to be pulled in when a concrete incident calls for one.
  Around that: `spec.md` (what "done" means, stated as checkable conditions, written before the
  first line of code), an entry-less `DECISIONS.md` (format only — the file exists from day one,
  the content accrues), `doc/adr/` in Michael Nygard / adr-tools form with a template and one
  real first entry, a `.tasks/active|done/` per-task file carrying a verification timestamp, and
  `tests/CLAUDE.md` as a worked example of the scaffold's "three addresses" rule (a constraint
  belongs in a code comment, in a file beside the code it governs, or in the root instruction
  file as a POINTER — and the root file should get shorter when knowledge is distributed, not
  longer). The branch-protection hook and its self-test are base-project-template's own files,
  copied verbatim rather than reimplemented.
integration: >
  Copy `templates/coding-agent-starter/` into your project root with `cp -RP` (the `-P` matters:
  `AGENTS.md` is a symlink to `CLAUDE.md`, and without it you get two files that drift), then
  `rm -rf .git && git init`. Run `.claude/hooks/selftest-branch-guard.sh` once to confirm the
  gate is live, fill `spec.md`, replace the placeholder gate in `CLAUDE.md` with the one rule
  whose violation would actually cost you, and leave `DECISIONS.md` empty. Graduate to
  `base-project-template` when skills, subagents, MCP or profiles start earning their keep.
