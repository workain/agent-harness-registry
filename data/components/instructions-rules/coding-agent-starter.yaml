provenance:
  - url: https://github.com/workain/agent-harness-registry/tree/main/templates/base-project-template
    fetched: "2026-09-23"
    note: >
      `.claude/settings.json` and `.claude/hooks/selftest-branch-guard.sh` are this repository's
      own base-project-template `with-git` files, copied byte-for-byte rather than reimplemented,
      so the one component that is a real mechanical gate cannot diverge between the two
      templates. Everything else was written fresh for this entry.
  - url: https://pubs.opengroup.org/onlinepubs/9799919799/utilities/cp.html
    fetched: "2026-09-24"
    note: >
      POSIX.1-2024 `cp`, DESCRIPTION: "If the -R option was specified: If none of the options
      -H, -L, nor -P were specified, it is unspecified which of -H, -L, or -P will be used as a
      default." This is why the template's copy instruction carries `-P` explicitly. An earlier
      revision of this entry and of the template claimed that omitting `-P` turns the AGENTS.md
      symlink into a second real file; that claim was WRONG on the one implementation actually
      tested — GNU coreutils 9.4 preserves the symlink under plain `cp -R` (verified) and only
      `cp -RL` dereferences it. The corrected wording states the standard's silence rather than a
      behaviour.
  - url: https://code.claude.com/docs/en/memory
    fetched: "2026-09-24"
    note: >
      Source of the two quotes the template's "three addresses" section rests on — that
      path-scoped rules "trigger when Claude reads files matching the pattern, not on every tool
      use", and that "Project-root CLAUDE.md survives compaction: after /compact, Claude re-reads
      it from disk and re-injects it into the session. Nested CLAUDE.md files in subdirectories
      and rules with paths: frontmatter reload as Claude reads files they apply to." Also the
      source for the shipped rule file's own warning that an invalid glob matches nothing and the
      rule then silently never loads, while the rule's other patterns keep working.
  - url: https://code.claude.com/docs/en/hooks
    fetched: "2026-09-24"
    note: >
      Section "Workspace trust", quoted verbatim: "Interactive session: Claude Code holds back
      hooks from every settings file, including your own ~/.claude/settings.json, until you accept
      the workspace trust dialog for the folder, or for a parent directory whose trust extends to
      it"; and "-p or SDK session: Claude Code never shows the dialog and treats the folder as
      trusted, so hooks committed in a repository's .claude/settings.json run in a folder you've
      never trusted." Read from the live page; neither behaviour was reproduced in a running
      session.
  - url: https://code.claude.com/docs/en/permissions
    fetched: "2026-09-24"
    note: >
      Section "Workspace trust" — why the "or for a parent directory" half of the hooks quote does
      not rescue this template: trust covers subdirectories "apart from a git repository nested
      inside it, such as a clone", and "the parent-folder column doesn't apply inside a nested
      repository: in an interactive session Claude Code shows the trust dialog for it". The
      template's own `git init` is what makes the project such a nested repository.
unverified:
  - "NO research pass. base-project-template's content decisions each trace to one of two documented evidence passes; this template's do not. Its structure was derived from that template plus a seminar's teaching sequence, and should be read as a plausible, internally-consistent starting point rather than an evidence-backed default."
  - "The switch from the subtractive first design to this prefilled one was an operator product decision, NOT a measured result. Neither design has been compared against the other, and the subtractive version's own central claim never had independent evidence either — that was stated at the time and is repeated in the deep-dive. What is claimed here is only that the prefilled version satisfies the stated acceptance test (copy the structure, say what you are doing, get a working repository); whether it produces better projects is unmeasured."
  - "Verified only mechanically, and only on one machine (Linux, GNU coreutils 9.4, git 2.x, bash), re-run 2026-09-24 after the English rewrite: copied with `cp -RP` into a clean directory, `git init -b main`, skeleton commit — `AGENTS.md` is mode 120000 in the index; `selftest-branch-guard.sh` reports PASS on 9/9 with its 5 known limits printed; `CLAUDE.md`'s shipped body measures 747 words against its stated 800-word ceiling; the template contains zero Cyrillic characters. NOT tested: any other OS or shell (notably macOS/BSD `cp`, whose `-R` symlink default POSIX leaves unspecified), any agent engine other than Claude Code, multi-contributor use, or drift over time."
  - "The FIRST RUN block's effect has NOT been observed end to end in a real agent session. It was written to be executable by an agent and its individual steps are each mechanically checkable, but nobody has yet handed the scaffold plus one sentence to a fresh session and watched what came out. That is the template's single most load-bearing untested claim, because it is the one the whole design is organized around."
  - "The ADR claims in `doc/adr/README.md` — Michael Nygard 2011 as the practice's origin, `adr-tools` as its reference command set, and that there is no controlled measurement of ADRs helping a coding agent — are carried from a source review performed outside this repository and were NOT re-verified for this entry. They are stated in the template with that caveat attached."
  - "The branch-protection hook is a Claude Code `PreToolUse` hook, verified to DENY on `main` by invoking its command directly with a `git commit` payload — not by observing a refusal inside a running Claude Code session. Separately verified that it does NOT stop a shell `git commit`: after `git init` no git hook is installed and a commit on `main` from a plain shell exits 0. The workspace-trust behaviour was read from documentation, not reproduced."
