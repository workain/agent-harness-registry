name: coding-agent-starter
slug: coding-agent-starter
homepage: https://github.com/workain/agent-harness-registry/tree/main/templates/coding-agent-starter
category: instructions-rules
layer: "Instruction/identity layer (Block A) plus day-0 seeds of the decision-memory block — a 15-file project scaffold one rung below base-project-template, not a single convention file"
what_it_is: >
  A deliberately small, copy-ready project scaffold for a repository a coding agent will work
  in. Its organizing claim is subtractive: a CLAUDE.md holding a one-line project identity and
  exactly ONE text gate, with every other section removed rather than shipped as unfilled
  boilerplate, on the reasoning that instruction text is billed on every turn and a rule written
  ahead of a real need has nothing to check it. The remaining sections ship as ready-to-paste
  blocks in `doc/deferred.md`, to be pulled in when a concrete incident calls for one — and the
  template applies that rule to itself: it does NOT ship a filled-in `paths:`-scoped rule, because
  on day 0 there is no file-class convention for one to express, so anything written there would
  be written ahead of its need. The mechanism ships as a ready block in `doc/deferred.md` instead,
  with its own inclusion threshold (the convention stopped fitting in the root file AND the path
  pattern can be named in one expression). Around that: `spec.md` (what "done" means, stated as
  checkable conditions, written before the first line of code), an entry-less `DECISIONS.md`
  (format only — the file exists from day one, the content accrues), a `.tasks/active|done/`
  per-task file carrying a verification timestamp, and `doc/adr/` in Michael Nygard / adr-tools
  form — the format and the inclusion threshold, with NO entries, for the same reason it ships no
  filled-in rule: copying a template is not a decision to keep ADRs, so a dated `Status: Accepted`
  record in the copier's name would be one more thing asserted ahead of its need. Deleting either
  of the beyond-day-0 things means deleting what points at it from `CLAUDE.md`, and the unit
  differs: `.claude/` owns a whole pointer line, `doc/adr/` only the second half of the decisions
  line whose first half points at `DECISIONS.md` and stays. Both files that a reader deleting one
  of them would actually be looking at say which. The scaffold's "three
  addresses" rule is taught rather than pre-populated: a constraint belongs in a code comment, in
  a rule file whose declared path glob scopes it, or in the root instruction file as a POINTER —
  and the root file should get shorter when knowledge is distributed, not longer. The
  branch-protection hook and its self-test are base-project-template's own files, copied verbatim
  rather than reimplemented; the entry-level README states plainly that this hook is not a day-0
  practice and is shipped pre-wired only because its action, cost and frequency are nameable before
  the project exists. It also states who the hook does and does not stop: it is a Claude Code
  `PreToolUse` hook, so it fires on the agent's tool calls and does nothing about a human typing
  `git commit` in a terminal — a sixth blind spot on top of the five the self-test prints.
integration: >
  Copy `templates/coding-agent-starter/` into your project root with `cp -RP` (`AGENTS.md` is a
  symlink to `CLAUDE.md`; POSIX leaves `cp -R`'s symlink handling unspecified, so `-P` states the
  intent). The copied directory carries no `.git`, so no cleanup step is needed. Then, in this
  order: `git init -b main`; `git add -A && git commit` to put the skeleton on `main`;
  `bash .claude/hooks/selftest-branch-guard.sh` to confirm the hook is live; and only then
  `git switch -c <branch>` for the first task. The order is load-bearing — branching before the
  first commit leaves no `main` at all, because on an unborn HEAD `git switch -c` renames the
  unborn branch instead of creating a second one, leaving `.git/refs/heads/` empty and the branch
  guard protecting a branch that does not exist (reproduced; the README prints the commands).
  Then fill `spec.md`, replace the placeholder gate in `CLAUDE.md` with the one rule whose
  violation would actually cost you, and leave `DECISIONS.md` empty. Graduate to
  `base-project-template` when skills, subagents, MCP or profiles start earning their keep.
