provenance:
  - url: https://github.com/workain/agent-harness-registry/tree/main/templates/base-project-template
    fetched: "2026-09-23"
    note: >
      `.claude/settings.json` and `.claude/hooks/selftest-branch-guard.sh` are this repository's
      own base-project-template `with-git` files, copied byte-for-byte rather than reimplemented,
      so the one component that is a real mechanical gate cannot diverge between the two
      templates. Everything else was written fresh for this entry.
  - url: https://pubs.opengroup.org/onlinepubs/9799919799/utilities/cp.html
    fetched: "2026-09-24"
    note: >
      POSIX.1-2024 `cp`, DESCRIPTION: "If the -R option was specified: If none of the options
      -H, -L, nor -P were specified, it is unspecified which of -H, -L, or -P will be used as a
      default." This is why the template's copy instruction carries `-P` explicitly. An earlier
      revision of this entry and of the template claimed that omitting `-P` turns the AGENTS.md
      symlink into a second real file; that claim was WRONG on the one implementation actually
      tested — GNU coreutils 9.4 preserves the symlink under plain `cp -R` (verified) and only
      `cp -RL` dereferences it. The corrected wording states the standard's silence rather than a
      behaviour.
  - url: https://code.claude.com/docs/en/memory
    fetched: "2026-09-24"
    note: >
      Source of the two quotes the template's "three addresses" section rests on — that
      path-scoped rules "trigger when Claude reads files matching the pattern, not on every tool
      use", and that "Project-root CLAUDE.md survives compaction: after /compact, Claude re-reads
      it from disk and re-injects it into the session. Nested CLAUDE.md files in subdirectories
      and rules with paths: frontmatter reload as Claude reads files they apply to." Both were
      re-read from the live page for this revision; see `unverified:` for what that does and does
      not establish.
unverified:
  - "NO research pass. base-project-template's content decisions each trace to one of two documented evidence passes; this template's do not. Its structure was derived from that template plus a seminar's teaching sequence, and should be read as a plausible, internally-consistent starting point rather than an evidence-backed default. Nothing here contradicts that entry's evidence — but nothing independently supports the subtractive 'one gate, everything else deleted' claim either, which is this template's single most load-bearing design decision."
  - "Verified only mechanically, and only on one machine (Linux, GNU coreutils 9.4, git 2.x, bash), re-run 2026-09-24: the branch guard self-test reports PASS on 9/9 checks and prints its own 5 known limits; the README bootstrap sequence run verbatim from a clean copy — `cp -RP`, `git init -b main`, self-test, `git switch -c`, first commit — succeeds with `AGENTS.md` still mode 120000 in the index; `scripts/generate.py` exits 0. NOT tested: any other OS or shell (notably macOS/BSD `cp`, whose `-R` symlink default POSIX leaves unspecified), any agent engine other than Claude Code, multi-contributor use, or drift over time."
  - "The template does NOT ship a `paths:`-scoped rule, and teaches that the rule and its root-file pointer go in together or not at all. The asymmetry that makes both worth having once there IS something to point at is documented, not inferred: per Claude Code's memory documentation (re-fetched 2026-09-24, quoted verbatim in the template README) a path-scoped rule triggers when Claude reads a matching file, but after `/compact` only the project-root CLAUDE.md is re-read from disk, while nested files and path-scoped rules reload only once a matching file is opened again. Established by reading that documentation page directly — NOT by observing either behaviour in a running session, and no reproduction of the compaction behaviour was attempted for this entry."
  - "Written in Russian, unlike the rest of this registry — it was authored for a Russian-language seminar audience. No translated variant exists."
