name: coding-agent-starter
slug: coding-agent-starter
homepage: https://github.com/workain/agent-harness-registry/tree/main/templates/coding-agent-starter
category: instructions-rules
layer: "Instruction/identity layer (Block A) plus the decision-memory and task-memory blocks — a 16-file project scaffold one rung below base-project-template, not a single convention file"
what_it_is: >
  A small, prefilled project scaffold for a repository a coding agent will work in, designed
  to be finished by the agent itself. The intended sequence is three steps: copy the directory,
  tell the agent in one sentence what you are building, get a working repository. `CLAUDE.md`
  opens with a FIRST RUN block addressed to the agent rather than the human, carrying eight
  steps — fill the identity line and `spec.md`, detect AND RUN the project's real build/test
  commands rather than writing plausible ones, date the two undated decision records, run the
  branch-guard self-test, delete whatever is unused along with the pointers to it, delete the
  block itself, commit the skeleton on `main`, and branch. Nine bracketed slots are left in the
  shipped body and they are four decisions: the project identity (heading plus the line under it),
  the build/test commands (five slots), the branch-naming convention, and one project-specific
  gate. Everything else ships written: five gates that hold in any repository
  (no commit to main, no rewriting published history, no destructive or production command
  taken unilaterally, no committed secret, and no claim that something works without the
  output that shows it), a seven-step workflow, repository etiquette, a pointer section, and an
  800-word ceiling the file measures itself against. Around that: `spec.md` (what "done" means
  as checkable conditions, written before the first line of code), `DECISIONS.md` (format plus
  one worked entry), `doc/adr/` in Michael Nygard / adr-tools form with ADR-0001 already
  written, a `.tasks/active|done/` per-task file carrying a verification timestamp, and
  `.claude/rules/tests.md` as a real path-scoped rule with its `CLAUDE.md` pointer — the two
  going in and out together, because the glob buys context and the root pointer buys
  durability across `/compact`. Two records ship deliberately UNDATED — the first
  `DECISIONS.md` entry and ADR-0001 — because a dated `Status: Accepted` in the copier's name
  for a decision they were not present for is the scaffold asserting something on their behalf.
  This is a REVERSAL of the template's first design, which argued the opposite case (one text
  gate, every other section deleted, the rest parked in a `doc/deferred.md` of blocks to paste
  in later). That version was rejected by the operator as an essay about what to include rather
  than a thing to copy; `doc/deferred.md` is deleted and its content now lives in `CLAUDE.md`,
  where it is read. The deep-dive records the reversal rather than replacing the argument
  silently.
integration: >
  Copy `templates/coding-agent-starter/` into your project root with `cp -RP` (`AGENTS.md` is a
  symlink to `CLAUDE.md`; POSIX leaves `cp -R`'s symlink handling unspecified, so `-P` states the
  intent). The copied directory carries no `.git`, so no cleanup step is needed. Then `git init -b
  main`, open the agent in that directory, and tell it what you are building, ending with "read
  CLAUDE.md and do the first-run steps"; it does the rest, including the skeleton commit on `main`
  and the first task branch. The order is load-bearing — branching before the first commit leaves
  no `main` at all, because on an unborn HEAD `git switch -c` renames the unborn branch instead of
  creating a second one, leaving `.git/refs/heads/` empty and the branch guard protecting a branch
  that does not exist (reproduced; the README prints the commands). Graduate to
  `base-project-template` when skills, subagents, MCP or profiles start earning their keep.
