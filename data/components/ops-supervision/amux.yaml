license_tag: "MIT+Commons Clause (source-available)"
open_source: false
use_cases: "self-healing watchdog for parallel Claude Code / Codex CLI / Gemini CLI sessions, auto-compact-before-overflow, corruption-error auto-restart"
what_it_is: >
  A single-file, tmux-native "agent control plane" that runs, monitors, and orchestrates
  parallel coding-agent CLI sessions (Claude Code, OpenAI Codex CLI, Gemini CLI). Its
  supervision core is a self-healing watchdog that parses tmux pane output without modifying
  the wrapped CLI, and takes CLI-specific recovery actions: sends /compact when context drops
  below 50%, detects Claude Code's specific "redacted_thinking ... cannot be modified"
  corruption error and restarts the session while replaying the last message, and (opt-in via
  CC_AUTO_CONTINUE=1) auto-answers stuck confirmation prompts. Unlike a generic process
  supervisor, it reasons about model/CLI-specific failure signatures.
integration: >
  Single-file install, runs alongside tmux; point it at existing Claude Code / Codex / Gemini
  CLI sessions running in tmux panes -- no changes to the wrapped CLI itself.
