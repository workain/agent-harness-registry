use_cases: "minimalist dead-man's-switch for an agent loop -- append one curl call per cycle, get alerted on silence"
what_it_is: >
  The oldest, simplest player in the dead-man's-switch category (originally popular as a Heroku
  add-on, predates most competitors). Each "snitch" is a unique URL; the worked example on its
  own homepage is `run_backups_or_something && curl https://nosnch.in/c2354d53d2` -- append the
  curl call to the end of a job, and silence past the configured interval triggers an alert
  (email, mobile push). The same pattern generalizes trivially to an agent's per-cycle work, or
  a cron wrapper that only fires the curl once a heartbeat/PID-liveness check confirms the agent
  is genuinely still running. Catalogued alongside `healthchecks-io` as the closed-SaaS
  counterpoint -- same mechanism, no self-host option, but the single-purpose free tier
  ("The Lone Snitch," 1 snitch) is the lowest-friction way to try the pattern.
