name: PromptCanary
slug: promptcanary
category: ops-supervision
homepage: https://www.promptcanary.dev/
license: "Proprietary hosted SaaS -- no self-host, no source available"
license_tag: "Proprietary SaaS (usable via free tier)"
open_source: false
use_cases: "scheduled synthetic/canary probing of a deployed LLM/agent endpoint -- 'Pingdom for your AI feature'"
what_it_is: >
  A small, apparently early-stage SaaS that runs pre-defined test cases ("monitors") against a
  real, deployed LLM/agent endpoint on a fixed schedule (daily on its free tier, down to a
  15-minute cadence on its paid Team tier), diffs the latest response against the last
  known-good one, and alerts (email/Slack/webhook/PagerDuty) on drift or breakage. Also offers a
  CI gate (GitHub Actions) that fails a build if a prompt/model change breaks expected behavior.
  Works against "OpenAI, Anthropic, or any HTTPS endpoint," no SDK or proxy required. This is
  the ACTIVE-probing pattern (new synthetic requests on a schedule), distinct from PASSIVE trace
  scoring (grading real production traffic as it arrives) that dominates the broader
  LLM-observability market (LangSmith, Langfuse, Arize, Braintrust, Datadog LLM Observability,
  Helicone, PromptLayer, HoneyHive -- all checked, none do scheduled synthetic injection as a
  first-class feature; several use "canary" as marketing language for what is actually passive
  scoring). This is the one dedicated product found doing genuine scheduled active probing of a
  live agent endpoint -- see this category's own intro note on how thin this specific niche is.
