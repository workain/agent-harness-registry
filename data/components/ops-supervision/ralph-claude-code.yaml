use_cases: "supervising an unattended Claude Code loop-until-done run, crash/rate-limit-aware auto-relaunch, stuck-progress circuit breaking"
what_it_is: >
  A standalone CLI implementing Geoffrey Huntley's "Ralph" technique: a supervising outer loop
  that repeatedly relaunches the Claude Code CLI (read instructions -> execute -> track progress
  -> evaluate completion -> repeat) until a dual-condition exit gate fires (>=2 completion
  indicators AND an explicit EXIT_SIGNAL). Adds a circuit breaker (halts after 3 no-progress
  iterations or 5 repeats of the same error), configurable rate limiting (calls/hour and
  MAX_TOKENS_PER_HOUR), session continuity across iterations, and three-layer detection/handling
  of Claude's own API rate-limit window. This is a supervision policy layered above Claude Code's
  agent loop, not a replacement for it — squarely block-J equipment (the harness choosing/
  enforcing a policy) over an engine's own mechanism.
