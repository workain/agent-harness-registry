use_cases: "durable execution/checkpoint-and-resume for an agent loop -- a crashed worker is replaced and replays from the last journaled step, not agent-native but genuinely composed onto agent orchestration"
what_it_is: >
  A general-purpose, cloud-native durable-execution/workflow-orchestration engine (spun out of
  Uber's Cadence) -- NOT AI-specific, catalogued here because it is genuinely, concretely
  composed onto agent loops for crash-resume. The Temporal Service persists workflow execution
  history as an event log; every step (an "Activity") is retried and recovered automatically
  from that log. Applied to agents: the agent loop is expressed as a Temporal Workflow, LLM
  calls/tool invocations as Activities -- a crashed worker process is simply replaced by another
  worker replaying the event history, so the agent resumes its reasoning without losing its
  place. Concrete evidence, not abstract applicability: Temporal's own published case study
  describes Grid Dynamics migrating a LangGraph+Redis+Kafka deep-research agent (which was
  hitting race conditions, stale state, and stuck agents) onto Temporal's state/retry/
  exactly-once logic, eliminating "thousands of lines of retry code"; Temporal has also shipped
  an official integration with the OpenAI Agents SDK positioning it directly as agent-loop
  crash-survival infrastructure. Evidence found skews toward the LangGraph/OpenAI-Agents-SDK
  ecosystem, not Claude-native use specifically.
integration: >
  Self-host the Temporal Server (Docker Compose/Kubernetes) or use Temporal Cloud; the agent
  process connects as a Worker via a language SDK (Python/TS/Go/Java). Heavier infrastructure
  than a library import -- closer to standing up a dedicated service than adding a dependency.
