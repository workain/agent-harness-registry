what_it_is: >
  Canonical, independently versioned source for the agent skills used by YYLO CLI and YYLO Ledger —
  7 SKILL.md skills under skills/<slug>/ (ledger-tasks-yylo, wiki-yylo, workflow-yylo,
  artifact-yylo, understand-project-yylo, plan-ledger-tasks-yylo, ralph-loop-yylo) that teach an
  agent the YYLO controller workflow: Ledger task management and source-of-truth boundaries,
  revisioned wiki records, workflow records, provenance-bound artifacts, project inspection before
  planning, and one-task-to-validated-delivery execution. Installs through the open `skills` CLI
  (`npx skills add yylo-dev/yylo-skills`); every canonical slug ends in `-yylo`.
