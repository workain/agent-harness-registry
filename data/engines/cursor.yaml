name: Cursor
slug: cursor
homepage: https://cursor.com
interface: "Desktop IDE (VS Code fork), CLI, web/mobile cloud agents (browser + iOS app), Agents Window (since Cursor 3.0), JetBrains IDE integration"
what_it_is: >
  An AI-native code editor — a VS Code fork rebuilt so AI is a first-class part of the
  editor rather than a plugin. Ships Composer (Cursor's own proprietary coding model,
  still current per the site's own nav as of this cycle's re-fetch), an Agent Mode that
  reads the codebase/edits files/runs terminal commands in a loop (subagents run in
  parallel per-task, each routed to "the best model for the task"), Background Agents
  (sandboxed cloud execution, hands back a PR), a visual/browser design mode ("point,
  draw, or narrate UI changes... while agents edit the code underneath"), and Git
  checkpoints/rollback. Grok 4.5 (xAI's model, not Cursor's own) is available as a
  price-efficient routing option alongside frontier models. Integrates with GitHub,
  Slack, Linear, and JetBrains IDEs. No public source repository — proprietary,
  closed-source product.
license: "Proprietary — no public source repository found; closed-source commercial product"
open_source: false
sandboxing: "Background Agents run in a sandboxed cloud environment Cursor provisions; local Agent Mode runs with the invoking user's own filesystem/process permissions, gated by an approval/guardrail loop"
