name: Devin
slug: devin
homepage: https://devin.ai
interface: "Web app (app.devin.ai), Devin Desktop (IDE + agent command center, the renamed Windsurf), Devin for Terminal (CLI, with a /handoff command to escalate to cloud Devin), Slack integration, Linear/Jira integration, API"
what_it_is: >
  Cognition's autonomous AI software engineer product family. Cloud Devin is a tool-using
  agent with a persistent per-session workspace (terminal, code editor, browser) plus
  planning/reflection loops for long-running tasks (built to handle backlog items that take
  up to ~3 hours); sessions start from Slack (tag Devin in a thread), Linear/Jira (assign a
  ticket), the web app, or the API. Devin Desktop is a full IDE plus an "Agent Command
  Center" (Kanban-style task tracking, Spaces for sharing context/Git worktrees across
  agents) for orchestrating fleets of local and cloud agents, with Supercomplete
  (next-thought-prediction autocomplete) and Fast Context codebase navigation. Devin
  Desktop IS Windsurf, rebranded — not a separate later product: windsurf.com now 308-redirects
  to devin.ai/desktop, and Cognition's own FAQ describes this as a rebrand toward agent
  management, not a discontinuation (existing settings/extensions/workflows migrate
  automatically; JetBrains support for Windsurf continues separately). No public source
  repository — proprietary, closed-source product.
license: "Proprietary — no public source repository found; closed-source commercial product"
open_source: false
sandboxing: "Cloud Devin runs in a persistent, Cognition-managed workspace per session — not self-hosted or user-controlled infrastructure. Devin Desktop's local editing runs with the invoking user's own filesystem/process permissions; cloud hand-off (Devin for Terminal's /handoff, or Desktop's cloud agents) moves work into the same managed cloud workspace."
