name: Devin
slug: devin
homepage: https://devin.ai
interface: "Web app, Slack integration, Linear integration, API, Devin Desktop (full IDE + agent command center), Devin CLI, Devin Review, Windows VM"
what_it_is: >
  Cognition's autonomous AI software engineer: a tool-using agent with a persistent
  workspace (terminal, code editor, browser) plus planning/reflection loops supporting
  long-running tasks. Sessions can be started from Slack (tag Devin in a thread), Linear
  (assign a ticket), the web app, or the API. **As of 2026-08-10, Devin Desktop is
  Windsurf, rebranded** — Cognition confirms (own FAQ, fetched directly) "Devin Desktop
  is the new name for Windsurf. We're building on the IDE foundation of Windsurf to
  introduce the command center for managing all your agents in one place," retaining
  Windsurf's full IDE (syntax highlighting, debugging, Supercomplete completions,
  language servers for Rust/Python/Go/C/C++, ESLint/Prettier/rust-analyzer integration)
  plus a new Agent Command Center (Spaces, Kanban views, multi-agent coordination) on
  top — see `data/engines/windsurf.yaml` for the pre-rebrand entry, kept for history.
  Also integrates with 100+ tools including GitHub, Teams, and Datadog; recently added a
  "Security Swarm" feature per the homepage's own announcement banner. No public source
  repository — proprietary, closed-source product.
license: "Proprietary — no public source repository found; closed-source commercial product"
open_source: false
sandboxing: "Runs in a persistent, Cognition-managed workspace per session — not self-hosted or user-controlled infrastructure; local Devin Desktop/IDE work runs with the invoking user's own filesystem/process permissions, per its Windsurf lineage"
