name: Devin
slug: devin
homepage: https://devin.ai
interface: "Devin Cloud (web app), Devin Desktop (local IDE — the rebranded Windsurf, see below), Devin CLI, Slack/Teams integration, Linear integration, Devin Review (PR/visual QA), Devin Windows VM, API (v3)"
what_it_is: >
  Cognition's AI-software-engineer product family, not a single tool. Devin Cloud is the
  original autonomous web-based agent: a tool-using agent with a persistent, Cognition-managed
  workspace (terminal, code editor, browser) that can be started from Slack (tag Devin in a
  thread), Linear (assign a ticket), the web app, the CLI's `/handoff`, or the API, and can run
  fleets of agents in parallel (e.g. migrating multiple repos at once). CORRECTION (this cycle's
  re-fetch): Devin Desktop is NOT merely a later Devin release — as of 2026-06-02 it is the
  rebranded Windsurf (Cognition's acquired IDE; see this registry's separate `windsurf` entry,
  now largely superseded by this one). Per Cognition's own announcement, "Devin Desktop is a
  new look for the product you already love" — existing Windsurf plans/pricing/extensions
  carried over unchanged. Devin Desktop now positions itself as "the home for every agent you
  run": an Agent Command Center that manages local and cloud agents (via the Agent Client
  Protocol, ACP) including Codex, Claude Agent, OpenCode, and Cognition's own SWE-1.6, with
  "Spaces" grouping related agent sessions/PRs/files. Devin Local (replacing Cascade as the
  primary local agent, claimed "30% more token efficient") is the default local agent inside
  Devin Desktop. Integrates with GitHub, Datadog, Confluence, Stripe, AWS, and 30+ other
  platforms beyond Slack/Linear/Teams. No public source repository — proprietary, closed-source
  product.
license: "Proprietary — no public source repository found; closed-source commercial product"
open_source: false
sandboxing: "Devin Cloud sessions run in a persistent, Cognition-managed workspace; Devin Desktop's local agent(s) run with the invoking user's own filesystem/process permissions (same model Windsurf used), with one-click hand-off to a Cognition-managed cloud VM for heavier/parallel work; a separate Devin Windows VM offering exists for Windows-specific work"
