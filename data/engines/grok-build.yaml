name: Grok Build
slug: grok-build
homepage: https://github.com/xai-org/grok-build
interface: "Full-screen, mouse-interactive TUI; also runs headless for scripting/CI; embeddable via the Agent Client Protocol (ACP)"
what_it_is: >
  xAI's (branded "SpaceXAI" in the repo's own README, which states it "is synced periodically
  from the SpaceXAI monorepo") terminal-based coding agent — a direct category peer to this
  registry's Claude Code / Codex CLI / Gemini CLI entries. Understands a codebase, edits files,
  executes shell commands, searches the web, and manages long-running tasks; extensible via MCP
  servers, skills, plugins, and hooks. Originally a proprietary, paid feature for SuperGrok
  subscribers (~$30/mo per secondary reporting, not independently re-verified against a primary
  pricing page for this entry); open-sourced under Apache-2.0 on GitHub on 2026-07-15/16 (exact
  date disputed between secondary sources — see provenance) in the same week a serious data-
  exposure incident broke publicly (see the security note below), which multiple outlets
  characterized as the proximate trigger for open-sourcing it. GENUINELY NEW since this
  registry's last refresh: repo created 2026-07-14, already at 23.0k stars / 4.3k forks by this
  fetch — real, fast independent adoption, not just launch-week noise.
license: "Apache License 2.0 for first-party code, per the repo's own README; third-party dependencies retain their original licenses"
open_source: true
sandboxing: >
  Documents a permissions-and-sandbox model (docs.x.ai/build/settings): tool-policy rules gate
  which actions the agent may REQUEST, separately from OS-level sandbox profiles that gate what
  an approved process may actually REACH; several credential directories (SSH, GnuPG,
  cloud-provider, and Grok's own auth paths) are described as write-protected across profiles.
  IMPORTANT CAVEAT, disclosed prominently because it is load-bearing: this documented model
  governs LOCAL filesystem/process access. The security incident below involved a SEPARATE,
  undocumented NETWORK upload channel that these controls did not gate and that operated even
  with the model-training opt-out enabled — a different control surface than "sandboxing" as
  usually scoped in this registry, and worth reading as a distinct risk, not something the
  sandbox/permissions model above would have caught.
