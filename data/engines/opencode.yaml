name: OpenCode
slug: opencode
homepage: https://github.com/anomalyco/opencode
interface: "Terminal TUI, CLI, npm/standalone-binary install"
what_it_is: >
  A terminal-first, open-source AI coding agent: give it a goal in natural language and it
  breaks the goal into steps, reads the file structure, creates/edits files, installs
  packages, and runs terminal commands in a loop, interpreting output to fix its own
  mistakes. Provider-agnostic — supports 75+ LLM endpoints out of the box (Anthropic,
  OpenAI, Google, AWS Bedrock, Azure OpenAI, OpenRouter, and anything OpenAI-compatible
  including local Ollama servers), so it isn't locked to one vendor's models the way
  Claude Code/Codex CLI/Gemini CLI are. Originally built by the SST team at `sst/opencode`;
  the team rebranded to Anomaly and the canonical repo is now `anomalyco/opencode`
  (`sst/opencode` still resolves via a live 301 redirect). By star count this is the
  single largest engine in this registry — larger than Claude Code (140k) — making its
  prior absence from this catalog a real gap this cycle closes.
license: MIT
open_source: true
sandboxing: "n/a documented at the engine level — no built-in sandbox beyond normal filesystem/process access; safety is whatever approval flow the operator layers on top"
