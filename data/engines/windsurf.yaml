what_it_is: >
  RENAMED, NOT DISCONTINUED (this cycle's re-fetch, confirmed via primary source): as of
  2026-06-02, Cognition rebranded Windsurf as "Devin Desktop" — the old homepage
  (windsurf.com) now 308-redirects to devin.ai/desktop, and Cognition's own announcement
  states "Devin Desktop is a new look for the product you already love," with existing
  users' "plan, pricing, extensions, and other features remain[ing] the same." Devin Local
  now replaces Cascade as the primary local agent (Cognition claims "30% more token
  efficient"). This entry is kept for historical continuity (the product this registry's
  `windsurf-rules` component was built against) but the CURRENT, actively-maintained
  product identity lives under this registry's `devin` engine entry — treat that entry as
  authoritative for anything post-2026-06-02. Historically: an AI-native IDE (formerly
  Codeium) built around the Cascade agent — multi-file understanding via a proprietary
  "Fast Context" indexing system, terminal command execution, and cross-session project
  memory. Acquired by Cognition (maker of Devin) in December 2025 for ~$250M; Windsurf 2.0
  (April 2026) embedded Devin's autonomous agent directly into the IDE ahead of the full
  rebrand two months later. No public source repository — proprietary, closed-source
  product.
license: "Proprietary — no public source repository found; closed-source commercial product"
open_source: false
sandboxing: "Cloud VM hand-off for Devin-driven autonomous work (post Windsurf 2.0); local Cascade/Devin Local work runs with the invoking user's own filesystem/process permissions"
