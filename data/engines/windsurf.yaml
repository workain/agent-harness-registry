name: Windsurf (Cascade) — rebranded to Devin Desktop, 2026-08
slug: windsurf
homepage: https://devin.ai/desktop
interface: "Desktop IDE (VS Code fork), Cascade agent panel"
what_it_is: >
  **Superseded as of 2026-08-10: Windsurf has been rebranded to Devin Desktop.**
  `windsurf.com` now returns an HTTP 308 permanent redirect straight to
  `https://devin.ai/desktop` (confirmed via `curl -IL`, not just a WebFetch summary),
  and that page's own FAQ states plainly: "Devin Desktop is the new name for Windsurf.
  We're building on the IDE foundation of Windsurf..." Existing plans/pricing carry
  over unchanged, including legacy Windsurf Enterprise plans; Windsurf for JetBrains
  remains available separately under its own name. This entry is kept (rather than
  deleted) for history/traceability and because the `windsurf-rules` component still
  documents the underlying Rules/Memories convention — see `data/engines/devin.yaml`
  for the current, actively-branded product entry.
  ---
  Previously: an AI-native IDE (formerly Codeium) built around the Cascade agent —
  multi-file understanding via a proprietary "Fast Context" indexing system, terminal
  command execution, and cross-session project memory. Acquired by Cognition (maker of
  Devin) in December 2025 for ~$250M; Windsurf 2.0 (April 2026) embedded Devin's
  autonomous agent directly into the IDE, letting a user plan locally with Cascade then
  hand off to a cloud VM — a step that, in hindsight, was the run-up to this full
  rebrand. No public source repository — proprietary, closed-source product.
license: "Proprietary — no public source repository found; closed-source commercial product"
