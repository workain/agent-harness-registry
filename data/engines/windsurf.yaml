what_it_is: >
  SUPERSEDED ENTRY, kept for historical continuity only. Windsurf (formerly Codeium) was
  an AI-native IDE built around the Cascade agent — multi-file understanding via a
  proprietary "Fast Context" indexing system, terminal command execution, and
  cross-session project memory. Acquired by Cognition (maker of Devin) in December 2025.
  As of this refresh, Windsurf has been fully rebranded as **Devin Desktop**: windsurf.com
  now returns a live HTTP 308 redirect straight to devin.ai/desktop, and Cognition
  describes this in its own FAQ as a rebrand (toward agent-fleet management), not a
  discontinuation — existing settings/extensions/workflows migrate automatically. This is
  NOT a separate later Devin release layered on top of Windsurf; Devin Desktop IS the
  renamed Windsurf. For the current, actively-fetched product description, see this
  registry's `devin` entry — this `windsurf` entry is retained so existing citations/links
  to "Windsurf" in this registry keep resolving, not as an independent product going
  forward. No public source repository — proprietary, closed-source product.
